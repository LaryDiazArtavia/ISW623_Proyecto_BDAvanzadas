services:
  postgres-pruebas:
    image: postgres:16
    environment:
      POSTGRES_USER: estudiante
      POSTGRES_PASSWORD: pruebas123
      POSTGRES_DB: pruebas_sgbd
    ports:
      - "5436:5432"
    volumes:
      - postgres_pruebas_datos:/var/lib/postgresql/data

  mongo-pruebas:
    image: mongo:7
    command: ["mongod", "--auth", "--bind_ip_all"]
    ports:
      - "27019:27017"
    volumes:
      - mongo_pruebas_datos:/data/db
  
  kafka-pruebas:
    image: apache/kafka:3.8.0
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  
  metabase-pruebas:
    image: metabase/metabase:v0.50.26
    ports:
      - "3001:3000"
    volumes:
      - metabase_pruebas_datos:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      - postgres-pruebas


volumes:
  postgres_pruebas_datos:
  mongo_pruebas_datos:
  metabase_pruebas_datos:
