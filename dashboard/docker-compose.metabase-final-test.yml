
services:
  metabase-final-test:
    image: metabase/metabase:v0.50.26
    ports:
      - "3003:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_final_test_datos:/metabase-data
    networks:
      - default
      - pruebas

volumes:
  metabase_final_test_datos:

networks:
  pruebas:
    external: true
    name: isw623-pruebas_default
